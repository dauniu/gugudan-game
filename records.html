

<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#fff8ee" />
  <title>기록보기 | 수학공방</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      font-family: "Pretendard", "Noto Sans KR", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(180deg, #fffaf2 0%, #fbf3e7 100%);
      color: #4b2f1b;
    }
    body {
      display: flex;
      justify-content: center;
      padding: 22px 14px 34px;
    }
    .app {
      width: min(100%, 720px);
    }
    .homeBtn{
      display:inline-flex;
      align-items:center;
      gap:5px;
      padding:8px 12px;
      margin-bottom:14px;
      border-radius:12px;
      background:#fff;
      border:1px solid #eadfd5;
      color:#4b2f1b;
      text-decoration:none;
      font-size:13px;
      font-weight:900;
      box-shadow:0 5px 14px rgba(91,62,39,.06);
    }
    .hero {
      text-align: center;
      margin-bottom: 18px;
    }
    .trophy {
      width: 74px;
      height: 74px;
      margin: 0 auto 8px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 42px;
      background: #fff1b8;
      border: 2px solid #e8bd4e;
      box-shadow: 0 10px 22px rgba(157,112,26,.12);
    }
    h1 {
      margin: 0;
      font-size: clamp(34px, 8vw, 52px);
      letter-spacing: -0.05em;
      font-weight: 950;
    }
    .subtitle {
      margin: 8px 0 0;
      color: #8c6548;
      font-weight: 800;
      font-size: 15px;
    }
    .card {
      background: rgba(255,255,255,.86);
      border: 1px solid rgba(255,255,255,.95);
      border-radius: 26px;
      box-shadow: 0 14px 30px rgba(111,76,42,.10);
      padding: 18px;
      margin-bottom: 16px;
    }
    .cardTitle {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 21px;
      font-weight: 950;
      margin-bottom: 14px;
    }
    .mulIcon {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: white;
      background: #9a62b0;
      font-size: 26px;
      font-weight: 950;
    }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 4px;
      border-bottom: 1px dashed #eadfd5;
      font-size: 17px;
      font-weight: 850;
    }
    .row:last-of-type {
      border-bottom: 0;
    }
    .itemName {
      display: flex;
      align-items: center;
      gap: 9px;
    }
    .count {
      font-size: 20px;
      font-weight: 950;
      color: #7b4a2c;
      white-space: nowrap;
    }
    .summary {
      margin-top: 12px;
      padding: 14px;
      border-radius: 18px;
      background: #f7ecff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-weight: 950;
      font-size: 17px;
    }
    .coinCard {
      text-align: center;
      background: #fff4c8;
      border: 2px solid #e9c558;
    }
    .coinLabel {
      font-size: 15px;
      font-weight: 850;
      color: #755510;
    }
    .coinValue {
      margin-top: 4px;
      font-size: clamp(30px, 7vw, 44px);
      font-weight: 950;
      color: #3d2b0b;
    }
    .emptyNote {
      margin-top: 10px;
      color: #9b7f69;
      font-size: 13px;
      font-weight: 750;
      text-align: center;
    }
    .resetWrap {
      display: flex;
      justify-content: center;
      margin-top: 10px;
    }
    .resetBtn {
      border: 0;
      border-radius: 12px;
      padding: 10px 14px;
      font-weight: 900;
      background: #6b5a42;
      color: #fff;
      cursor: pointer;
    }
    footer {
      text-align: center;
      color: #936d4f;
      font-size: 12px;
      font-weight: 800;
      opacity: .7;
      padding-top: 6px;
    }
  </style>
</head>
<body>
  <main class="app">
    <a href="index.html" class="homeBtn">← 🏠 수학공방</a>

    <section class="hero">
      <div class="trophy">🏆</div>
      <h1>기록보기</h1>
      <p class="subtitle">모든 공방에서 완성한 작품을 한눈에 모아봐요!</p>
    </section>

    <section class="card">
      <div class="cardTitle">
        <div class="mulIcon">★</div>
        <div>수학공방 전체 기록</div>
      </div>

      <div class="row">
        <div class="itemName">🎂 케이크</div>
        <div class="count"><span id="cakeCount">0</span>개</div>
      </div>
      <div class="row">
        <div class="itemName">🍕 피자</div>
        <div class="count"><span id="pizzaCount">0</span>개</div>
      </div>
      <div class="row">
        <div class="itemName">🍔 햄버거</div>
        <div class="count"><span id="burgerCount">0</span>개</div>
      </div>
      <div class="row">
        <div class="itemName">🌻 해바라기</div>
        <div class="count"><span id="sunflowerCount">0</span>개</div>
      </div>
      <div class="row">
        <div class="itemName">🍅 방울토마토</div>
        <div class="count"><span id="tomatoCount">0</span>개</div>
      </div>
      <div class="row">
        <div class="itemName">🚀 로켓</div>
        <div class="count"><span id="rocketCount">0</span>개</div>
      </div>
      <div class="row">
        <div class="itemName">🤖 로봇</div>
        <div class="count"><span id="robotCount">0</span>개</div>
      </div>
      <div class="row">
        <div class="itemName">🚗 자동차</div>
        <div class="count"><span id="carCount">0</span>개</div>
      </div>
      <div class="row">
        <div class="itemName">🏠 집</div>
        <div class="count"><span id="houseCount">0</span>개</div>
      </div>

      <div class="summary">
        <span>✨ 총 완성품</span>
        <span><span id="totalCount">0</span>개</span>
      </div>
    </section>

    <section class="card coinCard">
      <div class="coinLabel">🪙 현재 코인</div>
      <div class="coinValue"><span id="coinCount">0</span>개</div>
      <div class="emptyNote">수학공방 전체에서 모은 공용 코인이에요.</div>
    </section>

    <div class="resetWrap">
      <button id="resetRecords" class="resetBtn" type="button">기록 초기화</button>
    </div>

 <footer>
  © 2026 DAUNIU<br>
  Code licensed under the MIT License.<br>
  Illustrations & characters © 2026 DAUNIU. All rights reserved.
</footer>

  </main>

  <script>
    (function(){
      const $ = id => document.getElementById(id);

      const items = ['cake','pizza','burger','sunflower','tomato','rocket','robot','car','house'];
      const workshops = ['gugudan','division','addition','subtraction'];

      function read(key){
        try{
          return parseInt(localStorage.getItem(key) || '0', 10) || 0;
        }catch(e){
          return 0;
        }
      }

      function getItemTotal(item){
        return workshops.reduce((sum, workshop)=>{
          return sum + read(workshop + '_' + item);
        }, 0);
      }

      function render(){
        const counts = {};
        items.forEach(item=>{
          counts[item] = getItemTotal(item);
        });

        $('cakeCount').textContent = counts.cake;
        $('pizzaCount').textContent = counts.pizza;
        $('burgerCount').textContent = counts.burger;
        $('sunflowerCount').textContent = counts.sunflower;
        $('tomatoCount').textContent = counts.tomato;
        $('rocketCount').textContent = counts.rocket;
        $('robotCount').textContent = counts.robot;
        $('carCount').textContent = counts.car;
        $('houseCount').textContent = counts.house;

        $('totalCount').textContent =
          items.reduce((sum, item)=>sum + counts[item], 0);

        $('coinCount').textContent = read('mathWorkshopCoins');
      }

      $('resetRecords').addEventListener('click', ()=>{
        const ok = confirm('완성품 기록을 모두 0으로 초기화할까?\\n코인은 그대로 유지돼.');
        if(!ok) return;

        workshops.forEach(workshop=>{
          items.forEach(item=>{
            try{
              localStorage.setItem(workshop + '_' + item, '0');
            }catch(e){}
          });
        });

        render();
      });

      render();
    })();
  </script>
  


</body>
</html>
