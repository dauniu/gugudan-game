<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#fff8ee" />
  <title>수학공방</title>
  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: #fff8ee;
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Noto Sans KR", "Segoe UI", sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
    }

    .page {
      position: relative;
      width: min(100vw, 1024px);
      aspect-ratio: 2 / 3;
      background: #fff8ee url("assets/main-menu.png") center top / 100% 100% no-repeat;
      overflow: hidden;
    }

    .hotspot {
      position: absolute;
      display: block;
      border-radius: 22px;
      text-decoration: none;
      -webkit-tap-highlight-color: transparent;
      outline: none;
    }

    .hotspot:focus-visible {
      box-shadow: 0 0 0 5px rgba(126, 83, 176, .32);
    }

    .hotspot:active {
      transform: scale(.985);
    }

    /* 공방 시작하기 버튼 */
    .start {
      left: 7.6%;
      top: 51.2%;
      width: 29%;
      height: 6.1%;
    }

    /* 기록보기 버튼 */
    .records {
      left: 29.2%;
      top: 89.8%;
      width: 40.2%;
      height: 5.4%;
    }

    /* 혹시 화면이 아주 넓은 데스크톱일 때도 깔끔하게 */
    @media (min-width: 1025px) {
      body {
        padding: 18px 0;
      }
      .page {
        border-radius: 28px;
        box-shadow: 0 18px 50px rgba(84, 55, 30, .10);
      }
    }
  </style>
</head>
<body>
  <main class="page" aria-label="수학공방 메인 화면">
    <a class="hotspot start"
       href="gugudan.html"
       aria-label="구구단 공방 시작하기"></a>

    <a class="hotspot records"
       href="records.html"
       aria-label="기록보기"></a>
  </main>
</body>
</html>
