<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>구구단 완성 게임</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#fff8f3;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;color:#2d2728}
.app{max-width:520px;margin:0 auto;padding:12px}
h1{font-size:22px;text-align:center;margin:4px 0 3px}
.desc{text-align:center;font-size:12px;color:#766b6d;margin:0 0 9px}
.coinbar{display:flex;align-items:center;justify-content:space-between;gap:8px;background:#fff0b8;border:2px solid #e5bd52;border-radius:14px;padding:8px 10px;margin-bottom:8px}
.coinbar strong{font-size:16px}.coinbar small{display:block;font-size:10px;margin-top:2px}
button{border:0;border-radius:11px;min-height:40px;padding:8px 12px;font-size:14px;font-weight:800;cursor:pointer}
.coinreset{background:#695942;color:#fff;white-space:nowrap}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-bottom:8px}
.stat{background:white;border:1px solid #eadedb;border-radius:11px;text-align:center;padding:5px;font-size:10px}
.stat b{display:block;font-size:17px}
.card{background:white;border:1px solid #eadedb;border-radius:16px;padding:10px;margin-bottom:8px}
label{display:block;font-size:12px;font-weight:900;margin-bottom:3px}
select{width:100%;height:38px;border:1px solid #dfd2ce;border-radius:9px;background:white;font-size:14px;padding:0 8px;margin-bottom:7px}
.ready{display:none;text-align:center;background:#fff1f3;border:1px solid #f0c7ce;border-radius:12px;padding:9px;margin-top:3px}
.ready strong{display:block;font-size:17px;margin-bottom:6px}
.start{width:100%;background:#d96877;color:white}
.gameArea{display:none}
.problem{text-align:center;font-size:38px;font-weight:950;letter-spacing:-1px;margin:8px 0}
.answerRow{display:flex;gap:6px}
input{min-width:0;flex:1;height:46px;border:2px solid #dfd2ce;border-radius:10px;font-size:26px;text-align:center;font-weight:900}
.submit{background:#d96877;color:white;min-width:72px}
.message{text-align:center;min-height:24px;font-size:12px;font-weight:800;margin-top:5px}
.visualTitle{font-size:13px;font-weight:900;margin-bottom:5px}
.visual{height:170px;background:linear-gradient(#fffaf6,#fff0e5);border-radius:12px;display:flex;align-items:flex-end;justify-content:center;overflow:hidden;padding:5px}
.grid{width:100%;display:grid;grid-template-columns:repeat(3,1fr);gap:4px;align-items:end}
.unit{height:72px;display:flex;align-items:flex-end;justify-content:center}
.stack{width:48px;display:flex;flex-direction:column-reverse;align-items:center}
.part{width:44px;border:1px solid rgba(70,45,35,.12);margin-top:-1px}
.bun{height:11px;background:#eaa84c;border-radius:7px}.top{height:15px;border-radius:18px 18px 6px 6px;background:linear-gradient(#f5c46a,#df9842)}
.tom{height:6px;background:#e8544d;border-radius:5px}.patty{height:9px;background:#70402f;border-radius:5px}.lettuce{height:7px;background:#68ad55;border-radius:5px}.sauce{height:5px;background:#f0ce56;border-radius:5px;width:40px}
.emojiUnit{font-size:42px;opacity:.14;transition:.2s}.emojiUnit.done{opacity:1}.emojiUnit.partial{opacity:.55}
.progress{height:8px;background:#f1e2df;border-radius:99px;overflow:hidden;margin-top:7px}
.bar{height:100%;width:0;background:#d96877;transition:.2s}
.stage{text-align:center;font-size:10px;color:#756a6d;margin-top:3px}
.restart{width:100%;background:#332d2e;color:#fff;margin-top:7px}
.resetBox{display:none;background:white;border:1px solid #e4d7d3;border-radius:12px;padding:10px;text-align:center;margin-bottom:8px}
.resetBtns{display:flex;gap:6px;margin-top:7px}.resetBtns button{flex:1}.yes{background:#d96877;color:white}.no{background:#eee8e6}
.reward{display:none;text-align:center;background:#fff0b8;border:2px solid #e5bd52;border-radius:12px;padding:9px;font-weight:900;margin-top:7px}
@media (max-height:720px){
  .app{padding:7px 10px}
  h1{font-size:18px}.desc{display:none}
  .coinbar{padding:5px 8px;margin-bottom:5px}.coinbar strong{font-size:14px}
  .stats{margin-bottom:5px}.stat{padding:3px}.stat b{font-size:15px}
  .card{padding:7px;margin-bottom:5px}
  select{height:34px;margin-bottom:5px}
  .problem{font-size:32px;margin:5px 0}
  .visual{height:138px}
  .unit{height:56px}.emojiUnit{font-size:34px}
  input{height:40px;font-size:23px}button{min-height:35px}
}
</style>
</head>
<body>
<div class="app">
  <h1>🎮 구구단 완성 게임</h1>
  <p class="desc">30문제를 모두 맞혀 완성하고 코인을 모아보자!</p>

  <div class="coinbar">
    <div><strong>🪙 모은 코인 <span id="coins">0</span>개</strong><small>300코인 = 게임시간 +10분</small></div>
    <button class="coinreset" id="coinReset" type="button">코인 리셋</button>
  </div>

  <div id="resetBox" class="resetBox">
    <strong>모아둔 코인을 0코인으로 리셋할까?</strong>
    <div class="resetBtns">
      <button id="resetYes" class="yes" type="button">응, 리셋</button>
      <button id="resetNo" class="no" type="button">취소</button>
    </div>
  </div>

  <div class="stats">
    <div class="stat">맞힌 문제<b id="score">0</b></div>
    <div class="stat">남은 정답<b id="left">30</b></div>
    <div class="stat">제한 시간<b id="timer">10초</b></div>
  </div>

  <section class="card">
    <label for="make">무엇을 만들까?</label>
    <select id="make">
      <option value="">선택해줘</option>
      <option value="cake">🎂 케이크</option>
      <option value="pizza">🍕 피자</option>
      <option value="burger">🍔 햄버거</option>
      <option value="sunflower">🌻 해바라기</option>
      <option value="tomato">🍅 방울토마토</option>
    </select>

    <label for="dan">어떤 구구단으로 할까?</label>
    <select id="dan">
      <option value="">선택해줘</option>
      <option value="all">2~9단 랜덤</option>
      <option value="2">2단</option><option value="3">3단</option><option value="4">4단</option>
      <option value="5">5단</option><option value="6">6단</option><option value="7">7단</option>
      <option value="8">8단</option><option value="9">9단</option>
    </select>

    <div id="ready" class="ready">
      <strong>준비됐지? 지금부터 시작한다! 🚀</strong>
      <button id="start" class="start" type="button">확인하고 시작!</button>
    </div>

    <div id="gameArea" class="gameArea">
      <div id="problem" class="problem">7 × 8 = ?</div>
      <form id="answerForm">
        <div class="answerRow">
          <input id="answer" type="number" inputmode="numeric" placeholder="정답" autocomplete="off">
          <button class="submit" type="submit">확인!</button>
        </div>
      </form>
      <div id="message" class="message" aria-live="polite"></div>
    </div>
  </section>

  <section class="card">
    <div id="visualTitle" class="visualTitle">완성할 항목을 골라줘</div>
    <div id="visual" class="visual"><div style="font-size:45px;opacity:.25">✨</div></div>
    <div class="progress"><div id="bar" class="bar"></div></div>
    <div id="stage" class="stage">정답 30개를 모으면 완성!</div>
    <div id="reward" class="reward"></div>
    <button id="restart" class="restart" type="button">처음부터 다시 만들기</button>
  </section>
</div>

<script>
(function(){
  const $ = id => document.getElementById(id);
  let correct=0, a=0, b=0, timer=null, timeLeft=10, playing=false;
  const coinKey='gugudanCoinsV2';
  let coins=0;
  try{ coins=parseInt(localStorage.getItem(coinKey)||'0',10)||0; }catch(e){ coins=0; }

  function saveCoins(){
    try{ localStorage.setItem(coinKey,String(coins)); }catch(e){}
    $('coins').textContent=coins;
  }
  function rand(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }

  function checkReady(){
    const ready = $('make').value && $('dan').value;
    $('ready').style.display = ready && !playing ? 'block' : 'none';
    if(!ready){
      $('gameArea').style.display='none';
    }
    renderVisual();
  }

  function stopTimer(){
    if(timer){ clearInterval(timer); timer=null; }
  }

  function newProblem(){
    if(!playing) return;
    stopTimer();
    const d=$('dan').value;
    a = d==='all' ? rand(2,9) : Number(d);
    b = rand(1,9);
    $('problem').textContent = `${a} × ${b} = ?`;
    $('answer').value='';
    timeLeft=10;
    $('timer').textContent='10초';
    timer=setInterval(()=>{
      timeLeft--;
      $('timer').textContent=timeLeft+'초';
      if(timeLeft<=0){
        stopTimer();
        $('message').textContent='⏰ 시간 초과! 새 문제!';
        setTimeout(newProblem,450);
      }
    },1000);
  }

  function startGame(){
    if(!$('make').value || !$('dan').value) return;
    correct=0;
    playing=true;
    $('score').textContent='0';
    $('left').textContent='30';
    $('bar').style.width='0%';
    $('reward').style.display='none';
    $('ready').style.display='none';
    $('gameArea').style.display='block';
    $('message').textContent='30개 정답을 모아보자! 🔥';
    renderVisual();
    newProblem();
  }

  function burgerVisual(){
    const complete=Math.floor(correct/6), partial=correct%6;
    const classes=['bun','tom','patty','lettuce','sauce','bun top'];
    let html='<div class="grid">';
    for(let i=0;i<5;i++){
      let parts=i<complete?6:(i===complete?partial:0);
      html+='<div class="unit"><div class="stack">';
      for(let p=0;p<parts;p++) html+=`<div class="part ${classes[p]}"></div>`;
      html+='</div></div>';
    }
    return html+'</div>';
  }

  function genericVisual(type){
    const icons={cake:'🎂',pizza:'🍕',sunflower:'🌻',tomato:'🍅'};
    const complete=Math.floor(correct/5), partial=correct%5;
    let html='<div class="grid">';
    for(let i=0;i<6;i++){
      let cls=i<complete?'done':(i===complete && partial>0?'partial':'');
      html+=`<div class="unit"><div class="emojiUnit ${cls}">${icons[type]}</div></div>`;
    }
    return html+'</div>';
  }

  function renderVisual(){
    const type=$('make').value;
    $('score').textContent=correct;
    $('left').textContent=Math.max(0,30-correct);
    $('bar').style.width=(correct/30*100)+'%';
    if(!type){
      $('visualTitle').textContent='완성할 항목을 골라줘';
      $('visual').innerHTML='<div style="font-size:45px;opacity:.25">✨</div>';
      return;
    }
    const names={cake:'케이크',pizza:'피자',burger:'햄버거',sunflower:'해바라기',tomato:'방울토마토'};
    $('visualTitle').textContent='나의 '+names[type];
    $('visual').innerHTML=type==='burger'?burgerVisual():genericVisual(type);
    $('stage').textContent=correct===30?'완성 성공! 🎉':`정답 ${correct}/30`;
  }

  function finish(){
    stopTimer();
    playing=false;
    coins+=60;
    saveCoins();
    $('timer').textContent='완료';
    $('gameArea').style.display='none';
    $('reward').style.display='block';
    $('reward').innerHTML = `🎉 성공! +60코인<br>현재 ${coins}코인` +
      (coins>=300 ? '<br><br>🎮 게임시간 +10분!<br>엄마에게 결과를 확인시켜줘 👩' : '');
    renderVisual();
  }

  $('make').addEventListener('change', checkReady);
  $('dan').addEventListener('change', checkReady);
  $('start').addEventListener('click', startGame);

  $('answerForm').addEventListener('submit', function(e){
    e.preventDefault();
    if(!playing) return;
    const raw=$('answer').value.trim();
    if(!raw) return;
    stopTimer();
    if(Number(raw)===a*b){
      correct++;
      $('message').textContent='정답! 한 단계 완성 ✨';
      renderVisual();
      if(correct>=30){ finish(); }
      else{ setTimeout(newProblem,300); }
    }else{
      $('message').textContent='아깝다! 새 문제로 다시 도전 💪';
      setTimeout(newProblem,420);
    }
  });

  $('restart').addEventListener('click', function(){
    stopTimer();
    playing=false;
    correct=0;
    $('make').value='';
    $('dan').value='';
    $('ready').style.display='none';
    $('gameArea').style.display='none';
    $('reward').style.display='none';
    $('timer').textContent='10초';
    $('message').textContent='';
    renderVisual();
  });

  $('coinReset').addEventListener('click', ()=> $('resetBox').style.display='block');
  $('resetNo').addEventListener('click', ()=> $('resetBox').style.display='none');
  $('resetYes').addEventListener('click', function(){
    coins=0;
    saveCoins();
    $('resetBox').style.display='none';
  });

  saveCoins();
  renderVisual();
})();
</script>
</body>
</html>
