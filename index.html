

<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#fff8ee" />
  <title>수학공방</title>

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: #fff8ee;
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard",
                   "Noto Sans KR", "Segoe UI", sans-serif;
      color: #4b2f1b;
    }

    body {
      display: flex;
      justify-content: center;
      padding: 22px 14px 34px;
      background:
        radial-gradient(circle at 50% -5%, #ffffff 0%, #fff8ee 38%, #fbf1e4 100%);
    }

    .page {
      width: min(100%, 900px);
	  position: relative;
    }
	.records-top {
	  position: absolute;
	  top: 8px;
      right: 8px;
	  z-index: 10;

  display: inline-flex;
  align-items: center;
  justify-content: center;

  padding: 8px 12px;
  border-radius: 12px;

  background: #fff8dc;
  border: 1px solid #ead59a;

  color: #6b5124;
  text-decoration: none;
  font-size: 12px;
  font-weight: 900;
}
    .hero {
      text-align: center;
      padding: 8px 0 24px;
    }

    .logo {
      width: 66px;
      height: 58px;
      margin: 0 auto 8px;
      position: relative;
    }

    .logo-house {
      position: absolute;
      left: 8px;
      right: 8px;
      bottom: 0;
      height: 42px;
      border: 4px solid #b9783b;
      border-radius: 8px 8px 12px 12px;
      background: #f7e8d2;
    }

    .logo-house::before,
    .logo-house::after {
      content: "";
      position: absolute;
      top: -12px;
      width: 38px;
      height: 5px;
      background: #b9783b;
      border-radius: 99px;
    }

    .logo-house::before {
      left: -5px;
      transform: rotate(-34deg);
    }

    .logo-house::after {
      right: -5px;
      transform: rotate(34deg);
    }

    .symbols {
      position: absolute;
      inset: 4px 6px 2px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      place-items: center;
      font-size: 16px;
      font-weight: 950;
      line-height: 1;
    }

    .symbols span:nth-child(1) { color: #6298d7; }
    .symbols span:nth-child(2) { color: #ef7965; }
    .symbols span:nth-child(3) { color: #72a76d; }
    .symbols span:nth-child(4) { color: #d7a443; }

    h1 {
      margin: 0;
      font-size: clamp(40px, 8vw, 62px);
      font-weight: 950;
      letter-spacing: -0.06em;
    }

    .subtitle {
      margin: 10px 0 0;
      color: #8d674a;
      font-size: clamp(15px, 3vw, 20px);
      font-weight: 800;
    }

    .games {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }

    .game-card {
      min-width: 0;
      overflow: hidden;
      border-radius: 28px;
      background: rgba(255,255,255,.88);
      border: 1px solid rgba(255,255,255,.95);
      box-shadow: 0 14px 32px rgba(96, 65, 38, .10);
      padding: 12px;
    }

    .game-image {
      display: block;
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      border-radius: 21px;
      background: #f5eadc;
    }

    .game-bottom {
      padding: 15px 5px 5px;
    }

    .game-title {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 12px;
      font-size: clamp(21px, 4vw, 30px);
      font-weight: 950;
      letter-spacing: -0.04em;
    }

    .symbol {
      width: 38px;
      height: 38px;
      flex: 0 0 38px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: white;
      font-size: 25px;
      font-weight: 950;
    }

    .multiply .symbol { background: #e98175; }
    .division .symbol { background: #79a84b; }
	.addition-game .symbol {background: #78a7dd;}
    .subtraction-game .symbol {background: #6ead7b;}
	.subtraction-game .play {
  background: linear-gradient(135deg, #f3a14b, #ed8437);
}
    .addition-game .play {background: linear-gradient(135deg, #78a7dd, #6093ce);}
    .play {
      display: flex;
      width: 100%;
      min-height: 48px;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border-radius: 15px;
      color: white;
      text-decoration: none;
      font-size: 16px;
      font-weight: 950;
      -webkit-tap-highlight-color: transparent;
      transition: transform .15s ease;
    }

    .multiply .play {
      background: linear-gradient(135deg, #e98479, #d76e67);
    }

    .division .play {
      background: linear-gradient(135deg, #82ad52, #6c9740);
    }

    .play:active {
      transform: scale(.98);
    }
.placeholder-image {
  width: 100%;
  aspect-ratio: 1 / 1;
  border-radius: 21px;
  background: linear-gradient(180deg, #eef7ea, #e1efdc);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
}

.placeholder-symbol {
  width: 72px;
  height: 72px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: #6ead7b;
  color: white;
  font-size: 46px;
  font-weight: 950;
}

.placeholder-text {
  font-size: 20px;
  font-weight: 950;
  color: #55775a;
}

.locked-button {
  display: flex;
  width: 100%;
  min-height: 48px;
  align-items: center;
  justify-content: center;
  border-radius: 15px;
  background: #e5ece3;
  color: #6f786e;
  font-size: 15px;
  font-weight: 950;
}
    .coming-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      margin-top: 18px;
    }

    .coming {
      min-width: 0;
      min-height: 126px;
      border-radius: 24px;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      border: 1px solid rgba(255,255,255,.9);
      box-shadow: 0 10px 25px rgba(96,65,38,.06);
    }

    .addition { background: #edf5fd; }
    .subtraction { background: #edf6ea; }

    .coming-symbol {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: white;
      font-size: 29px;
      font-weight: 950;
      margin-bottom: 8px;
    }

    .addition .coming-symbol { background: #78a7dd; }
    .subtraction .coming-symbol { background: #6ead7b; }

    .coming-title {
      font-size: 20px;
      font-weight: 950;
    }

    .locked {
      margin-top: 7px;
      color: #777;
      font-size: 13px;
      font-weight: 850;
    }

    .records-wrap {
      display: flex;
      justify-content: center;
      padding: 27px 0 15px;
    }

    .records {
      display: inline-flex;
      min-height: 50px;
      align-items: center;
      justify-content: center;
      gap: 9px;
      padding: 0 28px;
      border-radius: 18px;
      background: rgba(255,255,255,.9);
      border: 1px solid #eee1d6;
      color: #735035;
      text-decoration: none;
      font-size: 18px;
      font-weight: 950;
      box-shadow: 0 9px 22px rgba(96,65,38,.08);
    }

    footer {
      text-align: center;
      color: #9a785f;
      font-size: 12px;
      font-weight: 800;
      opacity: .75;
    }

    @media (max-width: 620px) {
      body {
        padding: 8px 8px 10px;
      }

      .page {
        width: 100%;
      }

      .hero {
        padding: 0 0 8px;
      }

      .logo {
        width: 48px;
        height: 42px;
        margin-bottom: 3px;
      }

      .logo-house {
        left: 6px;
        right: 6px;
        height: 31px;
        border-width: 3px;
      }

      .logo-house::before,
      .logo-house::after {
        top: -9px;
        width: 28px;
        height: 4px;
      }

      .symbols {
        inset: 2px 4px 1px;
        font-size: 12px;
      }

      h1 {
        font-size: 31px;
        line-height: 1;
      }

      .subtitle {
        margin-top: 4px;
        font-size: 12px;
      }

      .games {
        gap: 7px;
      }

      .game-card {
        border-radius: 16px;
        padding: 5px;
        box-shadow: 0 7px 18px rgba(96,65,38,.08);
      }

      .game-image,
      .placeholder-image {
        aspect-ratio: 1 / 1;
        border-radius: 12px;
      }

      .game-image {
        object-fit: cover;
      }

      .placeholder-symbol {
        width: 46px;
        height: 46px;
        font-size: 30px;
      }

      .placeholder-text {
        font-size: 14px;
      }

      .game-bottom {
        padding: 6px 2px 2px;
      }

      .game-title {
        gap: 5px;
        margin-bottom: 5px;
        font-size: 14px;
        line-height: 1.1;
      }

      .symbol {
        width: 24px;
        height: 24px;
        flex-basis: 24px;
        font-size: 17px;
      }

      .play,
      .locked-button {
        min-height: 34px;
        border-radius: 10px;
        font-size: 12px;
      }

      .records-wrap {
        padding: 8px 0 5px;
      }

      .records {
        min-height: 36px;
        padding: 0 18px;
        border-radius: 12px;
        font-size: 14px;
      }

      footer {
        font-size: 10px;
        padding-top: 0;
      }
    }

    @media (max-width: 360px) {
      .play {
        font-size: 12px;
      }

      .game-title {
        font-size: 15px;
      }
    }
  
    @media (max-width: 620px) and (max-height: 700px) {
      body { padding-top: 5px; padding-bottom: 6px; }
      .hero { padding-bottom: 5px; }
      .logo { width: 42px; height: 36px; margin-bottom: 1px; }
      h1 { font-size: 27px; }
      .subtitle { font-size: 11px; margin-top: 2px; }
      .games { gap: 5px; }
      .game-card { padding: 4px; }
      .game-image,
      .placeholder-image { aspect-ratio: 1 / 1; }
      .game-bottom { padding-top: 4px; }
      .game-title { font-size: 12px; margin-bottom: 4px; }
      .symbol { width: 21px; height: 21px; flex-basis: 21px; font-size: 15px; }
      .play,
      .locked-button { min-height: 30px; font-size: 11px; }
      .records-wrap { padding: 5px 0 3px; }
      .records { min-height: 32px; font-size: 13px; }
      footer { font-size: 9px; }
    }

  </style>
</head>

<body>
  <main class="page" aria-label="수학공방 메인 화면">
  
<!-- 기록보기 -->
    <a class="records-top" href="records.html">
      🏆 기록보기
    </a>
	
    <header class="hero">
      <div class="logo" aria-hidden="true">
        <div class="logo-house">
          <div class="symbols">
            <span>+</span><span>×</span>
            <span>−</span><span>÷</span>
          </div>
        </div>
      </div>

      <h1>수학공방</h1>
      <p class="subtitle">문제를 풀고, 하나씩 완성해요!</p>
    </header>

    <section class="games" aria-label="게임 선택">

      <!-- 구구단 공방 -->
      <article class="game-card multiply">
        <img
          class="game-image"
          src="assets/gugudan-workshop.png"
          alt="구구단 공방"
        />
        <div class="game-bottom">
          <div class="game-title">
            <span class="symbol">×</span>
            <span>구구단 공방</span>
          </div>
          <a class="play" href="gugudan.html">
            공방 시작하기 <span aria-hidden="true">→</span>
          </a>
        </div>
      </article>

      <!-- 나누기 공방 -->
      <article class="game-card division">
        <img
          class="game-image"
          src="assets/division-workshop.png"
          alt="나누기 공방"
        />
        <div class="game-bottom">
          <div class="game-title">
            <span class="symbol">÷</span>
            <span>나누기 공방</span>
          </div>
          <a class="play" href="division.html">
            공방 시작하기 <span aria-hidden="true">→</span>
          </a>
        </div>
      </article>

      <!-- 덧셈 공방 -->
      <article class="game-card addition-game">
        <img
          class="game-image"
          src="assets/addition-workshop.png"
          alt="덧셈 공방"
        />
        <div class="game-bottom">
          <div class="game-title">
            <span class="symbol">+</span>
            <span>덧셈 공방</span>
          </div>
          <a class="play" href="addition.html">
            공방 시작하기 <span aria-hidden="true">→</span>
          </a>
        </div>
      </article>

      <!-- 뺄셈 공방 -->
<article class="game-card subtraction-game">
  <img
    class="game-image"
    src="assets/subtraction-workshop.png"
    alt="뺄셈 공방"
  />

  <div class="game-bottom">
    <div class="game-title">
      <span class="symbol">−</span>
      <span>뺄셈 공방</span>
    </div>

    <a class="play" href="subtraction.html">
      공방 시작하기 <span aria-hidden="true">→</span>
    </a>
  </div>
</article>
	</section>
 <footer>

</footer>

  </main>

</body>
</html>
